<footer class="bar">
  <div class="inner">
    <app-miqat-logo class="word" variant="wordmark" [height]="20" />

    <nav class="links" [attr.aria-label]="'Footer' | t">
      <a href="/home#product">{{ 'Product' | t }}</a>
      <a href="/home#faq">{{ 'Help' | t }}</a>
      <!-- These pages are not written yet: shown as designed, not links. -->
      <a aria-disabled="true" [title]="'The privacy policy is not published yet' | t">{{ 'Privacy' | t }}</a>
      <a aria-disabled="true" [title]="'The terms are not published yet' | t">{{ 'Terms' | t }}</a>
      <a aria-disabled="true" [title]="'There is no status page yet' | t">{{ 'Status@@service' | t }}</a>
    </nav>

    <span class="copy">{{ '© {year} Miqat · Made in Cairo' | t: { year: year } }}</span>
  </div>
</footer>
