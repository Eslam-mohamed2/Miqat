<header class="bar">
  <div class="inner">
    <a class="brand" routerLink="/home">
      <app-miqat-logo variant="wordmark" [height]="22" />
    </a>

    <nav class="sections" [attr.aria-label]="'Main@@navigation' | t">
      <a href="/home#product">{{ 'Product' | t }}</a>
      <a href="/home#day">{{ 'How it works' | t }}</a>
      <a href="/home#region">{{ 'Arabic and Hijri' | t }}</a>
      <a href="/home#faq">{{ 'Questions' | t }}</a>
    </nav>

    <div class="actions">
      <!-- Written in the language it switches to, so the person it is for can read it. -->
      <button type="button" class="lang" [class.latin]="other === 'en'" [attr.lang]="other"
        [attr.aria-label]="other === 'ar' ? 'Switch to Arabic' : 'Switch to English'"
        (click)="switchLanguage()">{{ other === 'ar' ? 'العربية' : 'English' }}</button>
      <a class="sign-in" routerLink="/login">{{ 'Sign in' | t }}</a>
      <a class="start" routerLink="/register">{{ 'Get started' | t }}</a>
    </div>
  </div>
</header>
