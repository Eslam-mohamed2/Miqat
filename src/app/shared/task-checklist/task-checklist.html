<h3 class="item-title">
  <mat-icon>checklist</mat-icon> Checklist
  <span class="count" *ngIf="list().length">{{ doneCount() }} of {{ list().length }}</span>
</h3>

<div class="steps-bar" *ngIf="list().length" role="progressbar" aria-label="Checklist progress"
     [attr.aria-valuenow]="percent()" aria-valuemin="0" aria-valuemax="100">
  <span class="steps-fill" [style.width.%]="percent()"></span>
</div>

<ul class="line-list" *ngIf="list().length">
  <li class="line" *ngFor="let line of list(); trackBy: trackById; let first = first; let last = last"
      [class.done]="line.isDone">
    <button type="button" class="tick" role="checkbox" [attr.aria-checked]="line.isDone"
            [attr.aria-label]="line.title" [disabled]="busy()" (click)="toggle(line)">
      <mat-icon>{{ line.isDone ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
    </button>

    <input *ngIf="editingId() === line.id; else showTitle" class="line-input" type="text"
           [value]="editText()" [attr.maxlength]="titleMaxLength" aria-label="Rename checklist line"
           (input)="editText.set(textOf($event))" (keydown.enter)="commitRename(line)"
           (keydown.escape)="cancelRename()" (blur)="commitRename(line)" />
    <ng-template #showTitle>
      <button type="button" class="line-title" [disabled]="busy()" (click)="startRename(line)"
              title="Click to rename">{{ line.title }}</button>
    </ng-template>

    <span class="line-actions">
      <button type="button" class="line-btn" [disabled]="busy() || first" (click)="move(line, -1)"
              [attr.aria-label]="'Move up: ' + line.title">
        <mat-icon>arrow_upward</mat-icon>
      </button>
      <button type="button" class="line-btn" [disabled]="busy() || last" (click)="move(line, 1)"
              [attr.aria-label]="'Move down: ' + line.title">
        <mat-icon>arrow_downward</mat-icon>
      </button>
      <button type="button" class="row-remove" [disabled]="busy()" (click)="remove(line)"
              [attr.aria-label]="'Remove: ' + line.title">
        <mat-icon>close</mat-icon>
      </button>
    </span>
  </li>
</ul>

<p class="item-empty" *ngIf="!loading() && !list().length">
  Break the task into smaller steps and tick them off as you go.
</p>

<form class="add-line" *ngIf="!loading()" (submit)="$event.preventDefault(); add()">
  <mat-icon>add</mat-icon>
  <input type="text" class="add-input" placeholder="Add a step" aria-label="Add a checklist line"
         [value]="draft()" [attr.maxlength]="titleMaxLength" (input)="draft.set(textOf($event))" />
  <button type="submit" class="add-btn" [disabled]="busy() || !draft().trim()">Add</button>
</form>

<p class="item-error" *ngIf="error()" role="alert">{{ error() }}</p>
