<h3 class="item-title">
  <mat-icon>notifications_none</mat-icon> Reminders
</h3>

<div role="list" class="reminder-list" *ngIf="list().length">
  <div role="listitem" class="reminder-row" *ngFor="let reminder of list(); trackBy: trackById">
    <span class="reminder-text">
      <strong>{{ label(reminder) }}</strong>
      <small>{{ ringsAt(reminder) }}</small>
    </span>
    <button type="button" class="row-remove" [disabled]="busy()" (click)="remove(reminder)"
            [attr.aria-label]="'Remove reminder: ' + label(reminder)">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>

<p class="item-empty" *ngIf="!loading() && !list().length">
  No reminder set. Pick when you want to hear about it:
</p>

<div class="choice-row" *ngIf="!loading()" role="group" aria-label="Add a reminder">
  <button type="button" class="choice" *ngFor="let choice of choices()"
          [class.taken]="choice.taken"
          [disabled]="choice.taken || busy() || isFull()"
          (click)="add(choice.minutes)">
    <mat-icon *ngIf="choice.taken">check</mat-icon>{{ choice.label }}
  </button>
</div>

<p class="item-note" *ngIf="isFull()">That is the most reminders one item can have.</p>
<p class="item-error" *ngIf="error()" role="alert">{{ error() }}</p>
