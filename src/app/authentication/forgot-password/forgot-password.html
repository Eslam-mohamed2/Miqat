<app-auth-shell>
  <form class="step" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="head">
      <h1>{{ 'Reset your password.' | t }}</h1>
      <p>{{ 'We’ll email you a {n}-digit code.' | t: { n: 6 } }}</p>
    </div>

    @if (errorMessage()) {
      <div class="notice error" role="alert">{{ errorMessage() }}</div>
    }

    <label class="field">{{ 'Email' | t }}
      <input id="email" type="email" dir="ltr" autocomplete="email" placeholder="you@company.com" formControlName="email"
        [attr.aria-invalid]="isFieldInvalid('email')" aria-describedby="email-error">
      @if (isFieldInvalid('email')) {
        <span id="email-error" class="field-error">{{ 'A valid email is required.' | t }}</span>
      }
    </label>

    <button type="submit" class="submit" [disabled]="isLoading()">{{ (isLoading() ? 'Sending…' : 'Send code') | t }}</button>
    <button type="button" class="quiet-link" (click)="backToSignIn()">{{ 'Back to sign in' | t }}</button>
  </form>
</app-auth-shell>
