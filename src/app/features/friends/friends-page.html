<div class="friends-page">

  <header class="page-header">
    <h1 class="greeting">Friends</h1>

    <div class="search-field">
      <mat-icon>search</mat-icon>
      <input type="search" placeholder="Search people…" aria-label="Search people"
             [ngModel]="searchText()" (ngModelChange)="onSearch($event)" />
    </div>
  </header>

  <!-- Tabs -->
  <nav class="tab-bar" role="tablist" aria-label="Friends sections">
    <button type="button" role="tab" *ngFor="let tab of tabs"
            [class.active]="activeTab() === tab.key"
            [attr.aria-selected]="activeTab() === tab.key"
            (click)="setTab(tab.key)">
      <mat-icon>{{ tab.icon }}</mat-icon>
      <span class="tab-label">{{ tab.label }}</span>
      <span class="tab-badge" *ngIf="tab.key === 'pending' && pendingCount() > 0">{{ pendingCount() }}</span>
    </button>
  </nav>

  <!-- Error -->
  <div class="error-banner" *ngIf="errorMessage()" role="alert">
    <mat-icon>error_outline</mat-icon>
    <span>{{ errorMessage() }}</span>
    <button type="button" (click)="errorMessage.set('')" aria-label="Dismiss"><mat-icon>close</mat-icon></button>
  </div>

  <!-- Loading -->
  <div class="card-grid" *ngIf="loading()">
    <div class="person-card skeleton" *ngFor="let i of [1,2,3,4,5,6]">
      <div class="sk-avatar"></div>
      <div class="sk-line long"></div>
      <div class="sk-line short"></div>
      <div class="sk-btn"></div>
    </div>
  </div>

  <ng-container *ngIf="!loading()">

    <!-- Empty -->
    <div class="state-card" *ngIf="isEmpty()">
      <div class="state-icon"><mat-icon>group_off</mat-icon></div>
      <p class="state-title">{{ emptyTitle() }}</p>
      <p class="state-sub">{{ emptySub() }}</p>
      <button type="button" class="primary-btn" *ngIf="activeTab() !== 'suggestions'"
              (click)="setTab('suggestions')">
        Find people
      </button>
    </div>

    <!-- Grid -->
    <div class="card-grid" *ngIf="visibleCards().length">
      <article class="person-card" *ngFor="let card of visibleCards(); trackBy: trackByUser">

        <button type="button" class="card-identity" (click)="viewProfile(card)">
          <img class="avatar-img" *ngIf="card.avatarUrl; else initialsAvatar"
               [src]="card.avatarUrl" [alt]="card.name" />
          <ng-template #initialsAvatar>
            <div class="avatar" [style.background]="avatarColor(card)">{{ initials(card.name) }}</div>
          </ng-template>

          <h2 class="person-name">{{ card.name }}</h2>
          <p class="person-sub" *ngIf="card.subtitle">{{ card.subtitle }}</p>
        </button>

        <!-- Suggestions: add / requested -->
        <div class="card-actions" *ngIf="activeTab() === 'suggestions'">
          <button type="button" class="btn primary" *ngIf="!isRequested(card.userId)"
                  [disabled]="isBusy(card.userId)" (click)="sendRequest(card)">
            <mat-icon>person_add</mat-icon>
            {{ isBusy(card.userId) ? 'Sending…' : 'Add friend' }}
          </button>
          <button type="button" class="btn muted" *ngIf="isRequested(card.userId)" disabled>
            <mat-icon>check</mat-icon> Request sent
          </button>
          <button type="button" class="btn subtle" [disabled]="isBusy(card.userId)" (click)="block(card)">
            Block
          </button>
        </div>

        <!-- Received requests: confirm / delete -->
        <div class="card-actions" *ngIf="activeTab() === 'pending'">
          <button type="button" class="btn primary" [disabled]="isBusy(card.userId)" (click)="accept(card)">
            Confirm
          </button>
          <button type="button" class="btn subtle" [disabled]="isBusy(card.userId)" (click)="reject(card)">
            Delete
          </button>
        </div>

        <!-- Friends: profile / unfriend -->
        <div class="card-actions" *ngIf="activeTab() === 'friends'">
          <button type="button" class="btn primary" (click)="viewProfile(card)">
            <mat-icon>account_circle</mat-icon> View profile
          </button>
          <button type="button" class="btn subtle" [disabled]="isBusy(card.userId)" (click)="unfriend(card)">
            Unfriend
          </button>
        </div>

        <!-- Sent: cancel -->
        <div class="card-actions" *ngIf="activeTab() === 'sent'">
          <button type="button" class="btn subtle wide" [disabled]="isBusy(card.userId)" (click)="cancelSent(card)">
            <mat-icon>undo</mat-icon>
            {{ isBusy(card.userId) ? 'Cancelling…' : 'Cancel request' }}
          </button>
        </div>

      </article>
    </div>

  </ng-container>
</div>
