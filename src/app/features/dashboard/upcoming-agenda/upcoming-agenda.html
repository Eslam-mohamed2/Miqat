<div class="agenda-card mt-20">
  <div class="card-header">
    <div class="title">Coming Up</div>
    <button type="button" class="btn-add" (click)="addTask.emit()" aria-label="Add a task" title="Add a task">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <div class="agenda-list">
    <div *ngIf="loaded() && !items().length" class="empty-state">
      <p>All caught up!</p>
    </div>

    <a *ngFor="let item of items(); trackBy: trackById" class="agenda-item"
       [routerLink]="item.link" [queryParams]="item.query">
      <div class="agenda-time">
        <span class="agenda-day">{{ item.day }}</span>
        <span>{{ item.time }}</span>
      </div>
      <div class="agenda-content" [style.borderLeftColor]="item.color">
        <div class="event-title">
          <mat-icon *ngIf="item.isEvent" class="kind-icon" aria-label="Event">event</mat-icon>{{ item.title }}
        </div>
        <div class="event-description">{{ item.description }}</div>
      </div>
    </a>
  </div>
</div>
