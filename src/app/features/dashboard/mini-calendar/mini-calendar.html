<div class="calendar-card">
  <div class="cal-header">
    <div class="month">{{ monthName() }}</div>
    <div class="actions">
      <button type="button" class="btn-nav" (click)="prevMonth()" aria-label="Previous month">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button type="button" class="btn-nav" (click)="nextMonth()" aria-label="Next month">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </div>

  <div class="dow-row">
    <div *ngFor="let dow of daysOfWeek" class="dow">{{ dow }}</div>
  </div>

  <div class="calendar-grid">
    <button type="button" *ngFor="let day of grid(); trackBy: trackByDay"
            class="cal-day"
            [class.other-month]="day.other"
            [class.today]="day.today"
            [class.has-event]="day.count > 0"
            [attr.aria-label]="label(day)"
            [title]="label(day)"
            (click)="onDayClick(day)">
      {{ day.num }}
    </button>
  </div>
</div>
